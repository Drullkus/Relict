plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Datagen output roots
var serverDatagenOutput = file('src/generated/server-resources')
var clientDatagenOutput = file('src/generated/client-resources')
// reportsData registers no JSON-writing providers, but serverData() still requires some --output for its
// PackOutput/DataGenerator plumbing. Scratch only, gitignored, and never src/generated/server-resources,
// so it cannot race or clobber a real serverData run.
var reportsScratchOutput = file('build/reports-scratch')

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir(serverDatagenOutput)
    srcDir(clientDatagenOutput)

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("**/.cache/**") // datagen cache files
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    data {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath
    }
    // The report samplers are ordinary DataProviders (see RelictReports) that need nothing `serverData`
    // provides beyond a resolved registry future, so this is a separate compile unit from `data` rather
    // than a system-property gate inside it. It depends on `data`'s output too, so it can call
    // RelictDatagen.datapackRegistryEntries() by reference instead of keeping a second, hand-duplicated
    // copy of the RegistrySetBuilder.
    reports {
        compileClasspath += main.compileClasspath + main.output + data.output
        runtimeClasspath += main.runtimeClasspath + data.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    addModdingDependenciesTo sourceSets.data
    addModdingDependenciesTo sourceSets.reports

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        "${mod_id}-data" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.data)
        }

        "${mod_id}-reports" {
            sourceSet(sourceSets.main)
            // `data` is loaded too, not just present on the classpath: NeoForge's dev launch only shares one
            // classloader (and one Bootstrap.bootStrap() state) with classes that belong to a loaded mod's
            // own source sets. Without this, RelictDatagen's classes load through a second, never-bootstrapped
            // copy of the same vanilla classes and "Not bootstrapped" fails even after an explicit bootstrap
            // call elsewhere. This also makes RelictDatagen's own @EventBusSubscriber methods discoverable
            // here, which is why generateData below checks -Drelict.reportsOnly and steps aside for it.
            sourceSet(sourceSets.data)
            sourceSet(sourceSets.reports)
        }
    }

    def mainMod = mods."${mod_id}"
    def dataMod = mods."${mod_id}-data"
    def reportsMod = mods."${mod_id}-reports"

    // Specify the modid for data generation and where to look for existing resources; each run adds its own
    // --output below.
    def datagenArguments = ['--mod', project.mod_id, '--all',
                            '--existing', file('src/main/resources').getAbsolutePath()]

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            loadedMods = [mainMod]
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            loadedMods = [mainMod]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mainMod]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        serverData {
            serverData()
            sourceSet = sourceSets.data
            loadedMods = [dataMod]

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            programArguments.addAll datagenArguments
            programArguments.addAll '--output', serverDatagenOutput.getAbsolutePath()
        }

        // Assets (textures, models, atlases) are generated here rather than in serverData, so that
        // client-only classes are legal and server runs never touch them.
        clientData {
            clientData()
            sourceSet = sourceSets.data
            loadedMods = [dataMod]

            programArguments.addAll datagenArguments
            programArguments.addAll '--output', clientDatagenOutput.getAbsolutePath()
        }

        // The terrain report samplers, split out of serverData: same kind of run, only the report
        // providers registered (see RelictReports), no tag/loot/advancement/registry-JSON providers.
        // Select which reports run with -Drelict.reports=ridge,voronoi,performance; omit it to run all.
        reportsData {
            serverData()
            sourceSet = sourceSets.reports
            loadedMods = [reportsMod]

            programArguments.addAll datagenArguments
            programArguments.addAll '--output', reportsScratchOutput.getAbsolutePath()

            // Same report directory serverData used to write into. Absolute, because datagen's working
            // directory is run/.
            systemProperty 'relict.terrainReportDir', file('prototypes/out').getAbsolutePath()

            // `data`'s classes are loaded (see the mods{} comment above) so RelictDatagen's own
            // @EventBusSubscriber methods are discovered too; this tells RelictDatagen.generateData to
            // step aside so its tag/loot/advancement/registry-JSON providers do not also run here.
            systemProperty 'relict.reportsOnly', 'true'

            // -Drelict.reports=... only sets a system property on the Gradle daemon's own JVM, not on this
            // run's forked one, so it has to be read here (build-script/configuration side) and forwarded.
            if (System.getProperty('relict.reports') != null) {
                systemProperty 'relict.reports', System.getProperty('relict.reports')
            }
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

// Visual tuning for the moon sprites. Deliberately a plain JavaExec rather than a Minecraft run: the
// pipeline it drives has no Minecraft types, so the tool opens in about a second instead of booting the
// game, and runClientData stays headless and deterministic for CI. It edits the configs only — the sprites
// themselves are always produced by runClientData, from the same code.
tasks.register('runMoonConfig', JavaExec) {
    group = 'relict'
    description = 'Opens the moon sprite config tool'
    classpath = sourceSets.data.runtimeClasspath
    mainClass = 'us.drullk.relict.moonconfig.tool.MoonConfigTool'
    args file('src/data/resources/moons').getAbsolutePath()
}

tasks.register('runStructureTemplates', JavaExec) {
    group = 'relict'
    description = 'Writes grayboxed structure NBT templates'
    classpath = sourceSets.data.runtimeClasspath
    mainClass = 'us.drullk.relict.datagen.tool.RelictStructureTemplates'
    args file('src/main/resources').getAbsolutePath()
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
